<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다 위키 | 멘토 노하우</title><style>body{margin:0;background:#f6fbfd;color:#143449;font-family:"Malgun Gothic",sans-serif;line-height:1.65}.head{background:linear-gradient(120deg,#05304e,#087fb5);color:#fff;padding:42px 0}.wrap{max-width:820px;margin:auto;padding:0 22px}.head h1{margin:9px 0;font-size:2.3rem;letter-spacing:-.07em}.head p{margin:0;color:#d8f2fb}.bar{padding:23px 0}.back,.consult{border-radius:8px;padding:10px 14px;font-weight:800;text-decoration:none}.back{background:#fff;border:1px solid #b6dce9;color:#075c85}.card{background:#fff;border:1px solid #cce5ee;border-radius:15px;padding:25px}.card h2{font-size:1.25rem;margin:25px 0 10px}.meta{color:#63808e}.know{list-style:none;padding:0;margin:0}.know li{border-bottom:1px solid #e2eef2;padding:14px 0}.know li:before{content:'⚓';margin-right:9px;color:#087fb5}.consult{border:0;background:#087fb5;color:#fff;font-size:1rem;margin-top:23px}</style></head><body><header class="head"><div class="wrap"><div>바다 위키 · 멘토 프로필</div><h1 id="title">어업인 노하우</h1><p id="sub">화면 시연용 예시 데이터입니다.</p></div></header><main class="wrap"><div class="bar"><a class="back" href="returnee.html">← 정보 검색으로 돌아가기</a></div><article class="card"><div class="meta" id="profile"></div><h2>정리된 노하우</h2><ul class="know" id="know"></ul><button class="consult" id="consult">상담 신청</button></article></main><script>const data={김영호:['봄철 멸치 조업 전에는 3일치 바람과 파고를 함께 확인합니다.','출항 전 그물의 찢어진 부분과 부표 연결 상태를 먼저 살핍니다.','기장 연안은 조류 변화가 빨라 초보자는 가까운 어장부터 익히는 것이 좋습니다.'],최도윤:['멸치가 많이 잡히는 시기에도 무리한 출항보다 안전 판단이 먼저입니다.','그물은 조업 뒤 바로 씻어 말리면 다음 작업이 훨씬 수월합니다.','영도 인근 항구의 출항·입항 동선을 미리 확인해 두세요.'],박미숙:['고등어는 잡은 뒤 온도 관리가 품질을 크게 좌우합니다.','선별할 때는 크기뿐 아니라 표면 손상도 함께 확인합니다.','작업대와 보관 상자를 매번 깨끗하게 관리하는 습관이 중요합니다.'],윤태식:['출항 전 구명조끼와 통신 장비를 가장 먼저 확인합니다.','고등어 조업은 날씨 변화에 대비해 귀항 시간을 넉넉히 잡습니다.','처음에는 경험자와 함께 어장 위치와 항로를 익혀 보세요.'],이준석:['양식은 수질 기록을 꾸준히 남기는 것에서 시작합니다.','굴·전복은 계절별 관리 일정과 먹이 상태를 함께 살핍니다.','귀어 초기에는 지역 어촌계의 교육·규정을 먼저 확인해 보세요.'],정해원:['수온·염분·날씨를 날짜별로 기록하면 변화가 보입니다.','양식장 도구는 사용 뒤 세척·건조해 질병 위험을 줄입니다.','이상 징후가 보이면 혼자 판단하지 말고 주변 경험자와 상의합니다.']};const q=new URLSearchParams(location.search),n=q.get('name')||'김영호',r=q.get('region')||'부산 기장',s=q.get('species')||'멸치';title.textContent=n+' 어업인의 노하우';sub.textContent=r+' · '+s+' · 화면 시연용 예시 데이터';profile.textContent='선택한 지역과 어종에 맞는 '+n+' 어업인의 경험입니다.';know.innerHTML=(data[n]||data.김영호).map(x=>'<li>'+x+'</li>').join('');consult.onclick=()=>alert(n+' 어업인에게 상담 신청을 준비했습니다. (시연용 예시 기능)');</script></body></html>
