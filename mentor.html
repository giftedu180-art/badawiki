<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다 위키 | 멘토 노하우</title><style>body{margin:0;background:#f6fbfd;color:#143449;font-family:"Malgun Gothic",sans-serif;line-height:1.65}.head{background:linear-gradient(120deg,#05304e,#087fb5);color:#fff;padding:42px 0}.wrap{max-width:820px;margin:auto;padding:0 22px}.head h1{margin:9px 0;font-size:2.3rem}.head p{margin:0;color:#d8f2fb}.bar{padding:23px 0}.back,.consult{border-radius:8px;padding:10px 14px;font-weight:800;text-decoration:none}.back{background:#fff;border:1px solid #b6dce9;color:#075c85}.card{background:#fff;border:1px solid #cce5ee;border-radius:15px;padding:25px}.card h2{font-size:1.25rem;margin:25px 0 10px}.meta{color:#63808e}.score{display:inline-block;background:#fff4d6;color:#805900;padding:4px 8px;border-radius:5px;margin-top:10px;font-weight:800}.know{list-style:none;padding:0;margin:0}.know li{border-bottom:1px solid #e2eef2;padding:14px 0}.know li:before{content:'⚓';margin-right:9px;color:#087fb5}.consult{border:0;background:#087fb5;color:#fff;font-size:1rem;margin-top:23px;cursor:pointer}.notice{font-size:.85rem;color:#63808e}</style></head><body><header class="head"><div class="wrap"><div>바다 위키 · 멘토 프로필</div><h1 id="title">어업인 노하우</h1><p id="sub">화면 시연용 가상 예시 데이터입니다.</p></div></header><main class="wrap"><div class="bar"><a class="back" href="returnee.html">← 정보 검색으로 돌아가기</a></div><article class="card"><div class="meta" id="profile"></div><div class="score" id="score"></div><h2>정리된 노하우</h2><ul class="know" id="know"></ul><button class="consult" id="consult">상담 신청</button><p class="notice">상담 및 포인트는 실제 거래·현금·상품권 교환과 연결되지 않는 시연용 기능입니다.</p></article></main><script>const q=new URLSearchParams(location.search),n=q.get('name')||'김영호',r=q.get('region')||'부산 기장',s=q.get('species')||'멸치';const info={김영호:[4.9,128],최도윤:[4.8,112],박미숙:[4.9,119],윤태식:[4.7,95],이준석:[4.6,86],정해원:[4.8,101],한지훈:[4.7,91],오세진:[4.6,78],서은아:[4.8,103],문성호:[4.7,89],배수현:[4.5,74],장민규:[4.9,116]}[n]||[4.7,0];title.textContent=n+' 어업인의 노하우';sub.textContent=r+' · '+s+' · 화면 시연용 가상 예시 데이터';profile.textContent='선택한 지역과 어종에 맞는 '+n+' 어업인의 경험입니다.';score.textContent='★ '+info[0]+' · 상담 '+info[1]+'회';know.innerHTML=['출항 전 날씨와 안전 장비를 먼저 확인합니다.','작업 뒤에는 장비 상태와 조업 내용을 기록합니다.','처음에는 지역 경험자와 함께 안전한 범위부터 익힙니다.'].map(x=>'<li>'+x+'</li>').join('');consult.onclick=()=>alert(n+' 어업인에게 상담 신청을 준비했습니다. (시연용 예시 기능)');</script></body></html>
