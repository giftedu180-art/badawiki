<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다 위키 | 귀어인</title>
<style>
:root{--navy:#05304e;--blue:#087fb5;--line:#cce5ee;--muted:#607a89}*{box-sizing:border-box}body{margin:0;background:#f6fbfd;color:#153549;font-family:"Malgun Gothic",sans-serif}.head{background:linear-gradient(120deg,#05304e,#087fb5);color:#fff;padding:38px 0}.wrap{max-width:1080px;margin:auto;padding:0 22px}.brand{font-weight:900;font-size:1.35rem}.head h1{margin:10px 0 5px;font-size:clamp(2rem,5vw,2.8rem);letter-spacing:-.08em}.head p{margin:0;color:#d7f1fb}.bar{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.back{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#fff;color:var(--navy);font-weight:800;text-decoration:none}.step{display:none;padding-bottom:45px}.step.active{display:block}.welcome{padding:20px 0 45px}.welcome h2{font-size:1.65rem;letter-spacing:-.07em}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.choice{border:2px solid var(--line);border-radius:18px;padding:27px;background:#fff;text-align:left;box-shadow:0 6px 18px #0640600d;cursor:pointer}.choice:hover{border-color:var(--blue);transform:translateY(-3px)}.choice .icon{font-size:2.4rem}.choice h3{font-size:1.35rem;margin:12px 0 6px}.choice p,.note{color:var(--muted);line-height:1.65}.search{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;background:#fff;padding:15px;border:1px solid var(--line);border-radius:13px}.search select,.search button{border:1px solid #b6dbe8;border-radius:8px;padding:12px;background:#fff;font:inherit}.search button,.consult{background:var(--navy);color:#fff;font-weight:800}.note{font-size:.88rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px}.sea{display:grid;place-items:center;width:47px;height:47px;background:#e1f5fb;border-radius:13px;font-size:1.35rem}.card h2{font-size:1.2rem;margin:12px 0 4px}.meta{font-size:.87rem;color:var(--muted)}.tag{display:inline-block;background:#edf8fc;color:#0873a6;border-radius:5px;padding:4px 7px;font-size:.76rem;margin:11px 4px 9px 0}.achievement{background:#f3fafc;border-left:3px solid #30a7d3;padding:9px;font-size:.84rem;margin:4px 0 15px}.actions{display:flex;gap:7px}.actions button{flex:1;border-radius:7px;padding:9px;border:1px solid #8fcce3;background:#fff;color:#0873a6;font-weight:800;cursor:pointer}.actions .consult{background:var(--blue);color:#fff;border-color:var(--blue)}.empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted)}.form{max-width:650px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px}.form label{display:block;font-weight:800;margin:15px 0 6px}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #b6dbe8;border-radius:8px;font:inherit}.form textarea{min-height:100px;resize:vertical}.result{font-weight:800;color:#0873a6}.small{font-size:.83rem;color:var(--muted)}@media(max-width:720px){.choices,.grid{grid-template-columns:1fr}.search{grid-template-columns:1fr}.head{padding:28px 0}}
</style></head><body>
<header class="head"><div class="wrap"><div class="brand">바다 위키 · 귀어인</div><h1>바다 일을 시작하는 첫걸음</h1><p>현장 경험을 찾아보고, 필요한 도움을 요청해 보세요.</p></div></header>
<main class="wrap"><div class="bar"><b id="pageLabel">귀어인 시작</b><a class="back" href="index.html">← 사용자 선택</a></div>
<section class="step active" id="startStep"><div class="welcome"><h2>무엇을 도와드릴까요?</h2><p class="note">원하는 메뉴를 선택하면 다음 화면으로 넘어갑니다.</p><div class="choices"><button class="choice" data-step="searchStep"><div class="icon">🔎</div><h3>지역·어종별 정보 찾기</h3><p>관심 지역과 어종을 고르면 관련 경험을 가진 어업인과 노하우를 찾아볼 수 있어요.</p></button><button class="choice" data-step="consultStep"><div class="icon">💬</div><h3>상담 신청하기</h3><p>귀어 준비 중 궁금한 점을 적어 멘토에게 상담을 요청할 수 있어요.</p></button></div></div></section>
<section class="step" id="searchStep"><button class="back" data-home>← 메뉴 선택</button><h2>지역·어종별 정보 찾기</h2><div class="search"><select id="region"><option value="all">모든 지역</option><option>부산 기장</option><option>부산 영도</option><option>경남 통영</option></select><select id="species"><option value="all">모든 어종</option><option>멸치</option><option>고등어</option><option>굴·전복</option></select><button id="find">정보 검색</button></div><p class="note">이름·경력·업적은 발표 화면 시연을 위한 가상 예시 데이터입니다.</p><section class="grid" id="list"></section></section>
<section class="step" id="consultStep"><button class="back" data-home>← 메뉴 선택</button><h2>상담 신청하기</h2><p class="note">개인정보를 입력하지 않는 시연용 양식입니다.</p><form class="form" id="consultForm"><label for="topic">궁금한 분야</label><select id="topic"><option>조업 시작 전 준비</option><option>지역과 어종 선택</option><option>장비·안전 준비</option></select><label for="question">상담 내용</label><textarea id="question" placeholder="예: 부산에서 멸치 조업을 시작하려면 무엇부터 준비해야 하나요?"></textarea><button class="consult" type="submit" style="border:0;border-radius:8px;padding:12px 17px;margin-top:17px">상담 신청 보내기</button><p class="result" id="formResult"></p></form></section>
</main>
<script>
const mentors=[
 {name:'김영호',region:'부산 기장',species:'멸치',years:'32년',specialty:'기장 연안 멸치 어장·그물 관리',achievement:'기장 연안 어장 정보 기록 활동',know:['봄철 멸치 조업 전에는 3일치 바람과 파고를 함께 확인합니다.','출항 전 그물의 찢어진 부분과 부표 연결 상태를 먼저 살핍니다.','기장 연안은 조류 변화가 빨라 초보자는 가까운 어장부터 익히는 것이 좋습니다.']},
 {name:'최도윤',region:'부산 영도',species:'멸치',years:'27년',specialty:'영도 항구 출항 동선·멸치 선별',achievement:'계절별 조업 경험 공유',know:['멸치가 많이 잡히는 시기에도 무리한 출항보다 안전 판단이 먼저입니다.','그물은 조업 뒤 바로 씻어 말리면 다음 작업이 훨씬 수월합니다.','영도 인근 항구의 출항·입항 동선을 미리 확인해 두세요.']},
 {name:'박미숙',region:'부산 영도',species:'고등어',years:'24년',specialty:'영도 고등어 선별·신선도 관리',achievement:'수산물 선별·신선도 관리 경험',know:['고등어는 잡은 뒤 온도 관리가 품질을 크게 좌우합니다.','선별할 때는 크기뿐 아니라 표면 손상도 함께 확인합니다.','작업대와 보관 상자를 매번 깨끗하게 관리하는 습관이 중요합니다.']},
 {name:'윤태식',region:'부산 기장',species:'고등어',years:'21년',specialty:'기장 연안 고등어 조업 안전',achievement:'연안 조업 안전 기록',know:['출항 전 구명조끼와 통신 장비를 가장 먼저 확인합니다.','고등어 조업은 날씨 변화에 대비해 귀항 시간을 넉넉히 잡습니다.','처음에는 경험자와 함께 어장 위치와 항로를 익혀 보세요.']},
 {name:'이준석',region:'경남 통영',species:'굴·전복',years:'7년',specialty:'통영 굴·전복 양식 관리',achievement:'청년 귀어 준비 과정 경험 공유',know:['양식은 수질 기록을 꾸준히 남기는 것에서 시작합니다.','굴·전복은 계절별 관리 일정과 먹이 상태를 함께 살핍니다.','귀어 초기에는 지역 어촌계의 교육·규정을 먼저 확인해 보세요.']},
 {name:'정해원',region:'부산 기장',species:'굴·전복',years:'18년',specialty:'기장 양식장 수질 점검',achievement:'양식장 수질 점검 기록',know:['수온·염분·날씨를 날짜별로 기록하면 변화가 보입니다.','양식장 도구는 사용 뒤 세척·건조해 질병 위험을 줄입니다.','이상 징후가 보이면 혼자 판단하지 말고 주변 경험자와 상의합니다.']}
];
const list=document.querySelector('#list'),label=document.querySelector('#pageLabel');
function showStep(id){document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.id===id));label.textContent=id==='searchStep'?'지역·어종별 정보 찾기':id==='consultStep'?'상담 신청하기':'귀어인 시작';scrollTo(0,0)}
function render(){const r=region.value,s=species.value,found=mentors.filter(m=>(r==='all'||m.region===r)&&(s==='all'||m.species===s));list.innerHTML=found.length?found.map(m=>`<article class="card"><div class="sea">⚓</div><h2>${m.name} 어업인</h2><div class="meta">${m.region} · 경력 ${m.years}</div><span class="tag">${m.species}</span><div class="achievement"><b>이 어업인이 특히 잘하는 분야</b><br>${m.specialty}</div><div class="actions"><button onclick="openMentor('${m.name}')">노하우 보기</button><button class="consult" onclick="alert('${m.name} 어업인에게 상담 신청을 준비했습니다. (시연용 예시 기능)')">상담 신청</button></div></article>`).join(''):'<p class="empty">조건에 맞는 예시 멘토가 없습니다.</p>'}
function openMentor(name){const m=mentors.find(x=>x.name===name);location.href='mentor.html?name='+encodeURIComponent(m.name)+'&region='+encodeURIComponent(m.region)+'&species='+encodeURIComponent(m.species)}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>showStep(b.dataset.step));document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>showStep('startStep'));find.onclick=render;consultForm.onsubmit=e=>{e.preventDefault();formResult.textContent='상담 신청을 준비했습니다. (시연용 예시 기능이며 내용은 저장되지 않습니다.)'};render();
</script></body></html>
